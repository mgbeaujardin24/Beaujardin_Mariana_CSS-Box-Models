<div class="band gray-2">
<div class="band red">
<div class="band gray-3">
<div class="band red-orange">

<div class="band orange">
<div class="band gray-5">
<div class="band yellow">
<div class="band gray-6">
<div class="band olive">
<div class="band gray-7">
<div class="band green">
<div class="band gray-8">
<div class="band navy">
<div class="band gray-9">
<div class="band blue">
<div class="band gray-10">

<div class="center">

</html>
